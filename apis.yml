name: Industrious
description: 'Industrious is a global flexible workspace provider operating private offices, dedicated
  and open coworking memberships, and on-demand meeting rooms across hundreds of locations worldwide.
  Members manage access, bookings, and workspace services through the Industrious member portal and
  iOS/Android mobile apps. The company was surfaced as a portfolio company of Fifth Wall and added to
  the API Evangelist network. As of this enrichment pass Industrious publishes a consumer/member web
  and mobile experience but no public developer API, developer portal, SDKs, or API documentation;
  this profile therefore captures company identity and domain-security posture only.'
